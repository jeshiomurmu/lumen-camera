name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: input
    id: phone
    attributes: { label: Phone model and OS version }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Steps to reproduce, what you expected, screenshots" }
    validations: { required: true }

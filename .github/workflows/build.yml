# Builds the installable apps on GitHub's runners and publishes them as a release:
#   LumenCamera-<version>.apk          Android 10+, install directly
#   LumenCamera-<version>-unsigned.ipa iOS 17+, sign + install with Sideloadly or AltStore
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: AI models (ONNX)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: models
          key: lumen-models-${{ hashFiles('tools/export_models.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Export FFDNet + Real-ESRGAN
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install onnx onnxruntime numpy
          python tools/export_models.py --out models
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models/*.onnx
          if-no-files-found: error

  android:
    name: Android APK
    needs: models
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: models
          path: android/app/src/main/assets/models
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Keep the same signing key between builds (updates install over the old app)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lumen-android-debug-keystore-v1
      - name: SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null
      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log
      - name: Report build errors
        if: failure()
        run: python3 .github/report_errors.py android/gradle.log
      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/LumenCamera-1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  ios:
    name: iOS IPA (unsigned)
    needs: models
    if: ${{ !cancelled() }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: models
          path: ios/LumenCamera/Resources/Models
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project LumenCamera.xcodeproj -scheme LumenCamera -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" MARKETING_VERSION="1.0.${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload ../dist
          cp -R build/Build/Products/Release-iphoneos/Lumen.app Payload/
          zip -qry "../dist/LumenCamera-1.0.${GITHUB_RUN_NUMBER}-unsigned.ipa" Payload
          ls -la ../dist
      - name: Report build errors
        if: failure()
        run: python3 .github/report_errors.py ios/build.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa

  release:
    name: Publish release
    needs: [android, ios]
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-{apk,ipa}"
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Lumen Camera 1.0.${GITHUB_RUN_NUMBER}" --latest \
            --notes "Android: download the .apk on your phone and open it (allow installing unknown apps). iOS: sign and install the .ipa with Sideloadly or AltStore using your Apple ID. Built from ${GITHUB_SHA::7}."
